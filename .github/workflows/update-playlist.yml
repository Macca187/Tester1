name: Update TiviMate playlist

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 16 * * *'

permissions:
  contents: read

env:
  PLAYLIST_URL: https://nimble-gnome-675066.netlify.app/playlist.m3u
  NETLIFY_SITE_ID: 7c0f8515-4491-4a5b-a20b-792cf83477d1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          npm install -g netlify-cli

      - name: Build today's live sports section
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os,re,html
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          H={'User-Agent':'Mozilla/5.0 (TiviMate playlist updater)'}
          r=requests.get(os.environ['PLAYLIST_URL'],headers=H,timeout=60); r.raise_for_status()
          text=r.text.replace('\r\n','\n').replace('\r','\n'); lines=text.split('\n')

          def norm(s):
              s=html.unescape(s or '').upper()
              s=s.replace('ᴴᴰ',' ').replace('ᴿᴬᵂ',' ').replace('ᵁᴴᴰ',' ')
              s=re.sub(r'\b(HEVC|4K|SD|HD|IRELAND|EVENT)\b',' ',s)
              s=re.sub(r'\b(NOW|PRIME|VIP|UK):',' ',s)
              s=re.sub(r'[^A-Z0-9+]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          entries=[]; i=0
          while i<len(lines):
              if lines[i].startswith('#EXTINF:') and i+1<len(lines):
                  info,url=lines[i],lines[i+1]
                  if 'group-title="🔴 LIVE TODAY"' not in info:
                      display=info.split(',',1)[1] if ',' in info else ''
                      n=norm(display)
                      if n: entries.append((n,display,url))
                  i+=2
              else: i+=1
          entries.sort(key=lambda x:-len(x[0]))

          def find_channel(row_text,anchors):
              ans={norm(a) for a in anchors if norm(a)}
              row=norm(row_text)
              for n,display,url in entries:
                  if n in ans: return display,url
              for n,display,url in entries:
                  if len(n)>=5 and re.search(r'(?<![A-Z0-9])'+re.escape(n)+r'(?![A-Z0-9])',row): return display,url
              return None

          def title_from(anchors,display,row_text,time):
              bn=norm(display); parts=[]
              for a in anchors:
                  an=norm(a)
                  if an==bn: break
                  if a and an!=norm(time) and a not in parts: parts.append(a)
              if parts: return re.sub(r'\s+',' ',' v '.join(parts[:2])).strip()
              x=re.sub(r'\b'+re.escape(time)+r'\b',' ',row_text)
              return re.sub(r'\s+',' ',x).strip()

          now=datetime.now(ZoneInfo('Europe/London')); events=[]
          for source in ['https://www.wheresthematch.com/','https://tv-guide-listings.co.uk/sport/']:
              try:
                  sr=requests.get(source,headers=H,timeout=60); sr.raise_for_status()
                  soup=BeautifulSoup(sr.text,'html.parser')
              except Exception as e:
                  print('Warning: source failed',source,e); continue
              rows=soup.select('tr') or soup.select('[class*="event"],[class*="match"],[class*="listing"]')
              for el in rows:
                  row=' '.join(el.stripped_strings)
                  tm=re.search(r'\b([01]?\d|2[0-3]):[0-5]\d\b',row)
                  if not tm: continue
                  hhmm=tm.group(0); anchors=[a.get_text(' ',strip=True) for a in el.find_all('a')]
                  match=find_channel(row,anchors)
                  if not match: continue
                  display,url=match; title=title_from(anchors,display,row,hhmm)
                  if not title or len(title)>220: continue
                  h,m=map(int,hhmm.split(':')); dt=now.replace(hour=h,minute=m,second=0,microsecond=0)
                  events.append((dt,title,display,url))

          selected=[]; seen=set()
          for dt,title,display,url in sorted(events,key=lambda x:(x[0],x[1])):
              key=(dt.strftime('%H:%M'),re.sub(r'\W+','',norm(title)))
              if key in seen: continue
              seen.add(key); selected.append((dt,title,display,url))

          live=['# --- AUTO-GENERATED LIVE SPORTS ---']
          for dt,title,display,url in selected:
              live += [f'#EXTINF:-1 group-title="🔴 LIVE TODAY",{dt:%H:%M} • {title} • {display}',url]

          out=[]; i=0; inserted=False
          while i<len(lines):
              if lines[i].startswith('#EXTINF:') and 'group-title="🔴 LIVE TODAY"' in lines[i]:
                  if not inserted: out.extend(live); inserted=True
                  i+=2; continue
              out.append(lines[i]); i+=1
          if not inserted:
              pos=1 if out and out[0].startswith('#EXTM3U') else 0; out[pos:pos]=live+['']

          os.makedirs('deploy',exist_ok=True)
          open('deploy/playlist.m3u','w',encoding='utf-8').write('\n'.join(out).rstrip()+'\n')
          open('deploy/_headers','w',encoding='utf-8').write('/playlist.m3u\n  Content-Type: text/plain; charset=utf-8\n')
          open('deploy/index.html','w',encoding='utf-8').write('<!doctype html><title>TiviMate Playlist</title>')
          print(f'Created {len(selected)} live events with matching existing channels.')
          PY

      - name: Deploy updated playlist to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --dir=deploy --prod --site="$NETLIFY_SITE_ID"
