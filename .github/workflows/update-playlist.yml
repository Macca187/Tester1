name: Update TiviMate playlist

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

env:
  PLAYLIST_URL: https://nimble-gnome-675066.netlify.app/playlist.m3u
  NETLIFY_SITE_ID: 7c0f8515-4491-4a5b-a20b-792cf83477d1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          npm install -g netlify-cli

      - name: Build today's live sports section
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os,re,html
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          H={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language':'en-GB,en;q=0.9'
          }

          r=requests.get(os.environ['PLAYLIST_URL'],headers=H,timeout=60)
          r.raise_for_status()
          text=r.text.replace('\r\n','\n').replace('\r','\n')
          lines=text.split('\n')

          def norm(s):
              s=html.unescape(s or '').upper()
              s=s.replace('ᴴᴰ',' ').replace('ᴿᴬᵂ',' ').replace('ᵁᴴᴰ',' ')
              s=re.sub(r'\b(HEVC|8K|4K|SD|HD|IRELAND|EVENT|EXCLUSIVE)\b',' ',s)
              s=re.sub(r'\b(NOW|PRIME|VIP|UK|US|CA|AU):',' ',s)
              s=re.sub(r'^\s*(CA EN|CA FR)\s*:\s*',' ',s)
              s=re.sub(r'^\s*(US|AU)\s*(\|)\s*',' ',s)
              s=re.sub(r'[^A-Z0-9+]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          entries=[]
          i=0
          while i<len(lines):
              if lines[i].startswith('#EXTINF:') and i+1<len(lines):
                  info,url=lines[i],lines[i+1]
                  if 'group-title="🔴 LIVE TODAY"' not in info and url.startswith(('http://','https://')):
                      display=info.split(',',1)[1] if ',' in info else ''
                      n=norm(display)
                      if n:
                          entries.append((n,display,url))
                  i+=2
              else:
                  i+=1
          entries.sort(key=lambda x:-len(x[0]))

          aliases={
              'FOX SPORTS 1':'FOX SPORTS 1',
              'FOX SPORTS 2':'FOX SPORTS 2',
              'FOX SOCCER PLUS':'FOX SOCCER PLUS',
              'CBS SPORTS NETWORK':'CBS SPORTS NETWORK',
              'ESPN2':'ESPN 2',
              'ESPN 2':'ESPN 2',
              'ESPN':'ESPN',
              'TSN PREMIUM':'TSN',
              'TSN':'TSN',
              'DAZN USA':'DAZN',
              'DAZN CANADA':'DAZN',
              'BEIN SPORTS':'BEIN SPORTS',
              'STAN SPORT':'STAN SPORT',
              'FOX SPORTS AUSTRALIA':'FOX SPORTS',
          }

          def region_hint(s):
              x=norm(s)
              if 'CANADA' in x or x.startswith('TSN') or 'SPORTSNET' in x or 'ONESOCCER' in x:
                  return 'CA'
              if 'AUSTRALIA' in x or x.startswith('ESPN AU'):
                  return 'AU'
              if any(k in x for k in ['USA','TUDN','CBS SPORTS','FOX SPORTS','ESPN','NBC','TBS','TNT USA']):
                  return 'US'
              return None

          def find_channel(row_text,anchors):
              candidates=[]
              ans=[norm(a) for a in anchors if norm(a)]
              row=norm(row_text)

              for an in ans:
                  for n,display,url in entries:
                      if n==an:
                          candidates.append((10000+len(n),display,url))
                  target=aliases.get(an,an)
                  if target:
                      for n,display,url in entries:
                          if target in n or n==target:
                              score=7000+len(target)
                              if 'PPV' in n and 'PPV' not in an:
                                  score-=1000
                              candidates.append((score,display,url))

              for n,display,url in entries:
                  if len(n)>=5 and re.search(r'(?<![A-Z0-9])'+re.escape(n)+r'(?![A-Z0-9])',row):
                      candidates.append((5000+len(n),display,url))

              if not candidates:
                  return None

              hint=region_hint(' '.join(anchors))
              if hint:
                  regional=[]
                  for score,display,url in candidates:
                      dn=norm(display)
                      if hint=='CA' and (dn.startswith('CA EN') or dn.startswith('CA FR') or 'TSN' in dn or 'SPORTSNET' in dn):
                          score+=2500
                      elif hint=='AU' and ('AUSTRALIA' in dn or 'ESPN 1' in dn or 'FOX SPORTS 50' in dn or 'BEIN SPORTS' in dn):
                          score+=2500
                      elif hint=='US' and ('US ' in dn or dn.startswith(('ESPN','FOX SPORTS','CBS SPORTS','NBC','TBS','TNT'))):
                          score+=2500
                      regional.append((score,display,url))
                  candidates=regional

              candidates.sort(key=lambda x:-x[0])
              return candidates[0][1],candidates[0][2]

          def title_from(anchors,display,row_text,time):
              bn=norm(display)
              parts=[]
              for a in anchors:
                  an=norm(a)
                  if an==bn:
                      break
                  if a and an!=norm(time) and a not in parts:
                      parts.append(a)
              if parts:
                  return re.sub(r'\s+',' ',' v '.join(parts[:2])).strip()
              x=re.sub(r'\b'+re.escape(time)+r'\b',' ',row_text)
              return re.sub(r'\s+',' ',x).strip()

          now=datetime.now(ZoneInfo('Europe/London'))
          today=now.date()
          events=[]

          sources=[
              ('wheresthematch','https://www.wheresthematch.com/','Europe/London'),
              ('tv-guide','https://tv-guide-listings.co.uk/sport/','Europe/London'),
              ('live-soccer-tv',f'https://www.livesoccertv.com/schedules/{today:%Y-%m-%d}/','America/New_York'),
          ]

          for source_name,source,source_tz in sources:
              try:
                  sr=requests.get(source,headers=H,timeout=60)
                  sr.raise_for_status()
                  soup=BeautifulSoup(sr.text,'html.parser')
              except Exception as e:
                  print('Warning: source failed',source,e)
                  continue

              rows=soup.select('tr')
              if not rows:
                  rows=soup.select('[class*="event"],[class*="match"],[class*="listing"],[href*="/events/"]')

              source_zone=ZoneInfo(source_tz)
              for el in rows:
                  row=' '.join(el.stripped_strings)
                  tm=re.search(r'\b([01]?\d|2[0-3]):[0-5]\d\b',row)
                  if not tm:
                      continue
                  hhmm=tm.group(0)
                  anchors=[a.get_text(' ',strip=True) for a in el.find_all('a')]
                  match=find_channel(row,anchors)
                  if not match:
                      continue
                  display,url=match
                  title=title_from(anchors,display,row,hhmm)
                  if not title or len(title)>220:
                      continue
                  h,m=map(int,hhmm.split(':'))
                  local_dt=datetime(today.year,today.month,today.day,h,m,tzinfo=source_zone)
                  uk_dt=local_dt.astimezone(ZoneInfo('Europe/London'))
                  events.append((uk_dt,title,display,url,source_name))

          selected=[]
          seen=set()
          for dt,title,display,url,source_name in sorted(events,key=lambda x:(x[0],x[1],x[2])):
              if dt.date()!=today:
                  continue
              key=(dt.strftime('%H:%M'),re.sub(r'\W+','',norm(title)),norm(display))
              if key in seen:
                  continue
              seen.add(key)
              selected.append((dt,title,display,url,source_name))

          live=['# --- AUTO-GENERATED LIVE SPORTS ---']
          for dt,title,display,url,source_name in selected:
              live += [f'#EXTINF:-1 group-title="🔴 LIVE TODAY",{dt:%H:%M} • {title} • {display}',url]

          out=[]
          i=0
          inserted=False
          while i<len(lines):
              if lines[i].startswith('#EXTINF:') and 'group-title="🔴 LIVE TODAY"' in lines[i]:
                  if not inserted:
                      out.extend(live)
                      inserted=True
                  i+=2
                  continue
              out.append(lines[i])
              i+=1

          if not inserted:
              pos=1 if out and out[0].startswith('#EXTM3U') else 0
              out[pos:pos]=live+['']

          os.makedirs('deploy',exist_ok=True)
          open('deploy/playlist.m3u','w',encoding='utf-8').write('\n'.join(out).rstrip()+'\n')
          open('deploy/_headers','w',encoding='utf-8').write('/playlist.m3u\n  Content-Type: text/plain; charset=utf-8\n')
          open('deploy/index.html','w',encoding='utf-8').write('<!doctype html><title>TiviMate Playlist</title>')

          print(f'Created {len(selected)} live events with matching existing channels from {len(sources)} schedule sources.')
          print('Sample matches:')
          for dt,title,display,url,source_name in selected[:15]:
              print(f'  {dt:%H:%M} | {title} | {display} | {source_name}')
          PY

      - name: Deploy updated playlist to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --dir=deploy --prod --site="$NETLIFY_SITE_ID"
