name: Update TiviMate playlist

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

env:
  PLAYLIST_URL: https://nimble-gnome-675066.netlify.app/playlist.m3u
  NETLIFY_SITE_ID: 34ea0489-94c2-47e6-98dc-2be3abab17dd

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          npm install -g netlify-cli

      - name: Build today's live football section
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os,re,html
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          H={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language':'en-GB,en;q=0.9'
          }

          r=requests.get(os.environ['PLAYLIST_URL'],headers=H,timeout=60)
          r.raise_for_status()
          text=r.text.replace('\\r\\n','\\n').replace('\\r','\\n')
          lines=text.split('\\n')

          def norm(s):
            s=html.unescape(s or '').upper()
            s=s.replace('ᴴᴰ',' ').replace('ᴿᴬᵂ',' ').replace('ᵁᴴᴰ',' ')
            s=re.sub(r'\\b(HEVC|8K|4K|SD|HD|IRELAND|EVENT|EXCLUSIVE|ULTRA HDR)\\b',' ',s)
            s=re.sub(r'\\b(NOW|PRIME|VIP|UK|US|CA|AU):',' ',s)
            s=re.sub(r'^\\s*(CA EN|CA FR)\\s*:\\s*',' ',s)
            s=re.sub(r'^\\s*(US|AU)\\s*\\|\\s*',' ',s)
            s=re.sub(r'[^A-Z0-9+]+',' ',s)
            return re.sub(r'\\s+',' ',s).strip()

          def sports_group(group):
            g=html.unescape(group or '').upper()
            # Keep only groups that are clearly sports-oriented.
            sports_terms=(
              'SPORT', 'SOCCER', 'ESPN', 'DAZN', 'TSN', 'SPORTSNET', 'FLO ',
              'BALLY SPORTS', 'MATCHROOM', 'MILB', 'MLB', 'NBA', 'NFL', 'NHL',
              'WNBA', 'NCAAB', 'NCAAF', 'CFL', 'NRL', 'AFL', 'UEFA', 'FIFA',
              'UFC', 'SUPERCROSS', 'TENNIS', 'GOLF', 'RUGBY', 'F1', 'MOTORSPORT',
              'MASTERS', 'WST', 'PEACOCK PPV', 'STAN PPV', 'VIAPLAY NHL',
              'PPV EVENT', 'CANADA WEST PPV', 'CBC PPV', 'VICTORY+ PPV',
              'BTN+ PPV', 'FIFA+ PPV', 'MAX PPV', 'PARAMOUNT+ PPV',
              'PRIME VIDEO PPV', 'NFHS PPV', 'PPV EVENT', 'APPLE TV F1'
            )
            return any(t in g for t in sports_terms)

          def bad_channel(display):
            n=norm(display)
            return ('ORIGINAL INFO' in n or n.startswith('INFO ') or n.startswith('(FLSP') or ' FLSP ' in f' {n} ')

          entries=[]
          i=0
          while i<len(lines):
            if lines[i].startswith('#EXTINF:') and i+1<len(lines):
              info,url=lines[i],lines[i+1]
              if 'group-title="🔴 LIVE TODAY"' not in info and url.startswith(('http://','https://')):
                gm=re.search(r'group-title="([^"]*)"',info)
                group=gm.group(1) if gm else ''
                display=info.split(',',1)[1] if ',' in info else ''
                if sports_group(group) and not bad_channel(display):
                  n=norm(display)
                  if n: entries.append((n,display,url,group))
              i+=2
            else:
              i+=1

          aliases={
            'ESPN2':'ESPN 2','TSN PREMIUM':'TSN','DAZN USA':'DAZN','DAZN CANADA':'DAZN',
            'FOX SPORTS AUSTRALIA':'FOX SPORTS','TNT SPORTS PLUS':'TNT SPORTS+'
          }

          broadcaster_re=r'(?:TNT SPORTS(?: \\d+)?|SKY SPORTS(?:\\+| FOOTBALL| GOLF| CRICKET| MAIN EVENT| PREMIER LEAGUE| ARENA| ACTION| TENNIS)?|ESPN(?: \\d+)?|ESPN\\+|TSN(?: \\d+)?|SPORTSNET(?: \\d+)?(?: PLUS)?|FOX SPORTS(?: \\d+)?|FOX SPORTS 1|FOX SPORTS 2|FOX SOCCER PLUS|CBS SPORTS NETWORK|DAZN(?: USA| CANADA)?|BEIN SPORTS(?: \\d+)?|PREMIER SPORTS(?: \\d+)?|STAN SPORT|WST PLAY|HBO MAX|JIOHOTSTAR|NWSL\\+|PARAMOUNT\\+|NBC SPORTS|USA NETWORK|PEACOCK|TELEMUNDO|UNIVERSO|APPLE TV\\+|FUBO|FUBOTV)'

          def channel_number(s):
            n=norm(s)
            m=re.search(r'\\b(?:TNT SPORTS|SKY SPORTS|ESPN|TSN|SPORTSNET|FOX SPORTS)\\s*(\\d+)\\b',n)
            return m.group(1) if m else None

          def region_rank(display):
            d=(display or '').upper().strip()
            if re.match(r'^(UK\\s*[|:]|UK -)',d):
              return 0
            if re.match(r'^(US\\s*[|:]|US -|CA(?: EN| FR)?\\s*[|:]|CA -|AU\\s*[|:]|AU -)',d):
              return 1
            if not re.match(r'^(?:[A-Z]{2}(?: EN| FR)?\\s*[|:]|[A-Z]{2} -)',d):
              return 0
            return 2

          def find_channel(row_text,anchors):
            row=norm(row_text)
            raw_hints=[]
            for a in anchors:
              x=norm(a)
              if x and re.search(broadcaster_re,x):
                raw_hints.append(x)
            known=re.findall(broadcaster_re,row)
            raw_hints += [x for x in known if x not in raw_hints]

            seen_hints=set()
            candidates=[]
            for hint in raw_hints:
              target=aliases.get(hint,hint)
              if target in seen_hints:
                continue
              seen_hints.add(target)
              hn=channel_number(target)
              for dn,display,url,group in entries:
                if bad_channel(display) or dn != target:
                  continue
                if hn and channel_number(dn) != hn:
                  continue
                candidates.append((region_rank(display),display,url,target))

            if not candidates:
              return None
            candidates.sort(key=lambda x:(x[0], entries.index(next(e for e in entries if e[1]==x[1]))))
            best=candidates[0]
            if best[0] > 1:
              return None
            return best[1],best[2]

          def title_from(row,anchors,display,hhmm):
            teams=[]
            for a in anchors:
              x=a.strip()
              if not x: continue
              if norm(x)==norm(display): break
              if re.search(r'\\s+(v|vs|@)\\s+',x,re.I): teams.append(x)
            if teams: return teams[0]
            x=re.sub(r'\\b'+re.escape(hhmm)+r'\\b','',row,flags=re.I)
            return re.sub(r'\\s+',' ',x).strip()

          now=datetime.now(ZoneInfo('Europe/London'))
          today=now.date()
          events=[]
          source=('live-soccer-tv',f'https://www.livesoccertv.com/schedules/{today:%Y-%m-%d}/','America/New_York')

          try:
            source_name,source_url,source_tz=source
            sr=requests.get(source_url,headers=H,timeout=60)
            sr.raise_for_status()
            soup=BeautifulSoup(sr.text,'html.parser')
            rows=soup.select('tr') or soup.select('[class*="event"],[class*="match"],[class*="listing"],[href*="/events/"]')
            source_zone=ZoneInfo(source_tz)
            for el in rows:
              row=' '.join(el.stripped_strings)
              tm=re.search(r'\\b([01]?\\d|2[0-3]):[0-5]\\d\\b',row)
              if not tm: continue
              hhmm=tm.group(0)
              anchors=[a.get_text(' ',strip=True) for a in el.find_all('a')]
              match=find_channel(row,anchors)
              if not match: continue
              display,url=match
              title=title_from(row,anchors,display,hhmm)
              if not title or len(title)>220: continue
              h,m=map(int,hhmm.split(':'))
              local_dt=datetime(today.year,today.month,today.day,h,m,tzinfo=source_zone)
              uk_dt=local_dt.astimezone(ZoneInfo('Europe/London'))
              events.append((uk_dt,title,display,url,source_name))
          except Exception as e:
            print('Warning: Live Soccer TV failed',e)

          selected=[]
          seen=set()
          for dt,title,display,url,source_name in sorted(events,key=lambda x:(x[0],x[1],x[2])):
            if dt.date()!=today: continue
            key=(dt.strftime('%H:%M'),re.sub(r'\\W+','',norm(title)),norm(display))
            if key in seen: continue
            seen.add(key)
            selected.append((dt,title,display,url,source_name))

          live=['# --- AUTO-GENERATED LIVE SPORTS ---']
          for dt,title,display,url,source_name in selected:
            live += [f'#EXTINF:-1 group-title="🔴 LIVE TODAY",{dt:%H:%M} • {title} • {display}',url]

          out=[]
          i=0
          inserted=False
          while i<len(lines):
            if lines[i].startswith('#EXTINF:') and 'group-title="🔴 LIVE TODAY"' in lines[i]:
              if not inserted:
                out.extend(live)
                inserted=True
              i+=2
              continue
            if lines[i].strip()=='# --- AUTO-GENERATED LIVE SPORTS ---':
              i+=1
              continue
            # Non-sports groups were filtered out when entries were parsed, so rebuild from sports entries only.
            if lines[i].startswith('#EXTINF:') and i+1<len(lines):
              info,url=lines[i],lines[i+1]
              gm=re.search(r'group-title="([^"]*)"',info)
              group=gm.group(1) if gm else ''
              if not sports_group(group):
                i+=2
                continue
            out.append(lines[i])
            i+=1
          if not inserted:
            pos=1 if out and out[0].startswith('#EXTM3U') else 0
            out[pos:pos]=live+['']

          os.makedirs('deploy',exist_ok=True)
          open('deploy/playlist.m3u','w',encoding='utf-8').write('\\n'.join(out).rstrip()+'\\n')
          open('deploy/_headers','w',encoding='utf-8').write('/playlist.m3u\\n  Content-Type: text/plain; charset=utf-8\\n')
          open('deploy/index.html','w',encoding='utf-8').write('<!doctype html><title>TiviMate Playlist</title>')

          print(f'Created {len(selected)} live football events from Live Soccer TV.')
          print('Sports-only groups enabled. Channel priority: UK exact match -> AU/CA/US exact match -> otherwise omit.')
          print(f'Kept {len(entries)} sports-group channels from the existing playlist.')
          for dt,title,display,url,source_name in selected[:30]:
            print(f'  {dt:%H:%M} | {title} | {display}')
          PY

      - name: Deploy updated playlist to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --dir=deploy --prod --site="$NETLIFY_SITE_ID"
