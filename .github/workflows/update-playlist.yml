name: Update TiviMate playlist

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

env:
  PLAYLIST_URL: https://nimble-gnome-675066.netlify.app/playlist.m3u
  NETLIFY_SITE_ID: 34ea0489-94c2-47e6-98dc-2be3abab17dd

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          npm install -g netlify-cli

      - name: Build clean sports playlist and LIVE TODAY
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, html
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          H = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept-Language': 'en-GB,en;q=0.9'
          }

          r = requests.get(os.environ['PLAYLIST_URL'], headers=H, timeout=90)
          r.raise_for_status()
          text = r.text.replace('\\r\\n','\\n').replace('\\r','\\n')
          lines = text.splitlines()

          SPORTS = (
            'SPORT','SOCCER','FOOTBALL','ESPN','DAZN','TSN','SPORTSNET','FLO SPORTS',
            'FOX SPORTS','SKY SPORTS','TNT SPORTS','BEIN SPORTS','PREMIER SPORTS',
            'BALLY SPORTS','MATCHROOM','NBA','NFL','NHL','MLB','MLS','WNBA','NCAAB',
            'NCAAF','CFL','NRL','AFL','UEFA','FIFA','UFC','WWE','SUPERCROSS',
            'TENNIS','GOLF','RUGBY','CRICKET','F1','FORMULA 1','MOTORSPORT','RACING',
            'WST','SNOOKER','DARTS','OLYMPIC','OLYMPICS','STAN SPORT','WORLD CRICKET',
            'MOTOGP','BOXING','FIGHT','EQUESTRIAN','HORSE RACING','SPORT TV'
          )

          def norm(s):
            s = html.unescape(s or '').upper()
            s = re.sub(r'[ᴴᴰᴿᴬᵂᵁᴴᴰᵀᴹ]+', ' ', s)
            s = re.sub(r'\\b(HEVC|8K|4K|SD|HD|EVENT|EXCLUSIVE|ULTRA HDR)\\b', ' ', s)
            s = re.sub(r'[^A-Z0-9+]+', ' ', s)
            return re.sub(r'\\s+', ' ', s).strip()

          def bad(name):
            n = norm(name)
            bad_terms = ('ORIGINAL INFO','CHANNEL INFO','NO SIGNAL','TEST CHANNEL','TRAILER','HIGHLIGHTS','REPLAY','VOD')
            return n.startswith('INFO ') or ' FLSP ' in f' {n} ' or any(x in n for x in bad_terms)

          def is_sport(group, name):
            return any(x in norm(group) for x in SPORTS) or any(x in norm(name) for x in SPORTS)

          def country(group, name):
            s = html.unescape(group or '').strip()
            n = html.unescape(name or '').strip()
            m = re.match(r'^([A-Za-z]{2})(?:\\s+EN|\\s+FR)?\\s*[|:-]', s)
            if m:
              return m.group(1).upper()
            m = re.match(r'^([A-Za-z]{2})(?:\\s+EN|\\s+FR)?\\s*[|:-]', n)
            if m:
              return m.group(1).upper()
            for code, label in [('UK','UK'),('US','USA'),('CA','Canada'),('AU','Australia')]:
              if re.search(rf'\\b{re.escape(code)}\\b', norm(s) + ' ' + norm(n)):
                return label
            return 'International'

          def sport_type(name, group):
            n = norm(name + ' ' + group)
            checks = [
              ('Football', ('SOCCER','FOOTBALL','UEFA','FIFA','MLS','NWSL','FOX SOCCER')),
              ('Basketball', ('NBA','WNBA','NCAAB')),
              ('American Football', ('NFL','NCAAF','CFL')),
              ('Ice Hockey', ('NHL',)),
              ('Baseball', ('MLB',)),
              ('Rugby', ('RUGBY','NRL','AFL')),
              ('Cricket', ('CRICKET',)),
              ('Tennis', ('TENNIS',)),
              ('Golf', ('GOLF',)),
              ('Motorsport', ('F1','FORMULA 1','MOTORSPORT','MOTOGP','SUPERCROSS')),
              ('Boxing & MMA', ('BOXING','UFC','FIGHT')),
              ('Wrestling', ('WWE',)),
              ('Darts & Snooker', ('DARTS','SNOOKER','WST')),
              ('Horse Racing', ('HORSE RACING','EQUESTRIAN')),
            ]
            for label, terms in checks:
              if any(t in n for t in terms): return label
            return 'Sports'

          entries = []
          i = 0
          while i < len(lines):
            if lines[i].startswith('#EXTINF:') and i + 1 < len(lines):
              info, url = lines[i], lines[i+1].strip()
              if url.startswith(('http://','https://')):
                group_m = re.search(r'group-title="([^"]*)"', info)
                group = group_m.group(1) if group_m else ''
                display = info.split(',',1)[1].strip() if ',' in info else ''
                if 'LIVE TODAY' not in group.upper() and is_sport(group, display) and not bad(display):
                  entries.append((display, url, group))
              i += 2
            else:
              i += 1

          # De-duplicate by stream URL while keeping the cleanest display name.
          unique = {}
          for display, url, group in entries:
            unique.setdefault(url, (display, group))
          entries = list(unique.values())

          # Live Soccer TV is the football schedule source.
          today = datetime.now(ZoneInfo('Europe/London')).date()
          events = []
          try:
            u = f'https://www.livesoccertv.com/schedules/{today:%Y-%m-%d}/'
            sr = requests.get(u, headers=H, timeout=60)
            sr.raise_for_status()
            soup = BeautifulSoup(sr.text, 'html.parser')
            rows = soup.select('tr')
            for el in rows:
              row = ' '.join(el.stripped_strings)
              tm = re.search(r'\\b([01]?\\d|2[0-3]):([0-5]\\d)\\b', row)
              if not tm: continue
              hhmm = tm.group(0)
              anchors = [a.get_text(' ', strip=True) for a in el.find_all('a')]
              # Only exact broadcaster/channel names; never substitute a different numbered channel.
              wanted = []
              for x in anchors + [row]:
                wanted += re.findall(r'(?:TNT SPORTS(?: \\d+)?|SKY SPORTS(?:\\+| FOOTBALL| GOLF| MAIN EVENT| PREMIER LEAGUE| ARENA| ACTION| TENNIS)?|ESPN(?: \\d+)?|ESPN\\+|TSN(?: \\d+)?|SPORTSNET(?: \\d+)?|FOX SPORTS(?: \\d+)?|FOX SOCCER PLUS|CBS SPORTS NETWORK|DAZN(?: UK| USA| CANADA)?|BEIN SPORTS(?: \\d+)?|PREMIER SPORTS(?: \\d+)?|STAN SPORT|WST PLAY|HBO MAX|JIOHOTSTAR|NWSL\\+|PARAMOUNT\\+|NBC SPORTS|USA NETWORK|PEACOCK|TELEMUNDO|UNIVERSO|APPLE TV\\+|FUBO(?:TV)?)', x.upper())
              wanted = list(dict.fromkeys(wanted))
              if not wanted: continue

              def clean(x):
                x = norm(x)
                x = re.sub(r'\\b(UK|USA|US|CANADA|CA|AUSTRALIA|AU)\\b', ' ', x)
                return re.sub(r'\\s+',' ',x).strip()

              # UK first, then AU, CA, US. Exact normalized channel name only.
              picked = None
              for wanted_name in wanted:
                target = clean(wanted_name)
                candidates = []
                for display, url, group in entries:
                  if clean(display) != target: continue
                  c = country(group, display)
                  rank = 0 if c == 'UK' else 1 if c in ('Australia','Canada','USA') else 9
                  candidates.append((rank, display, url))
                if candidates:
                  candidates.sort(key=lambda x:x[0])
                  if candidates[0][0] < 9:
                    picked = candidates[0]
                    break
              if not picked: continue

              # Get match title from the row, excluding broadcaster text.
              title = row
              title = re.sub(r'\\b([01]?\\d|2[0-3]):[0-5]\\d\\b', '', title)
              for w in wanted:
                title = re.sub(re.escape(w), '', title, flags=re.I)
              title = re.sub(r'\\s+',' ',title).strip(' -|')
              if not title or len(title) > 180: continue
              h,m = map(int, hhmm.split(':'))
              dt = datetime(today.year,today.month,today.day,h,m,tzinfo=ZoneInfo('America/New_York')).astimezone(ZoneInfo('Europe/London'))
              events.append((dt,title,picked[1],picked[2]))
          except Exception as e:
            print('Live Soccer TV warning:', e)

          # Build a genuinely clean M3U: header, LIVE TODAY, then only sport EXTINF/URL pairs.
          out = ['#EXTM3U']
          for dt,title,display,url in sorted(events, key=lambda x:x[0]):
            out.append(f'#EXTINF:-1 group-title="🔴 LIVE TODAY",{dt:%H:%M} • {title} • {display}')
            out.append(url)

          for display, url, group in sorted(entries, key=lambda x:(country(x[2],x[0]), sport_type(x[0],x[2]), norm(x[0]))):
            c = country(group, display)
            st = sport_type(display, group)
            out.append(f'#EXTINF:-1 group-title="Sports - {c} - {st}",{display}')
            out.append(url)

          os.makedirs('deploy', exist_ok=True)
          with open('deploy/playlist.m3u','w',encoding='utf-8',newline='\\n') as f:
            f.write('\\n'.join(out) + '\\n')
          with open('deploy/_headers','w',encoding='utf-8') as f:
            f.write('/playlist.m3u\\n  Content-Type: text/plain; charset=utf-8\\n')
          with open('deploy/index.html','w',encoding='utf-8') as f:
            f.write('<!doctype html><meta charset="utf-8"><title>TiviMate Sports Playlist</title>')

          print('SPORT CHANNELS:', len(entries))
          print('LIVE TODAY:', len(events))
          print('FORMAT: clean UTF-8 M3U; no comments or junk text; explicit Sports country/type categories')
          PY

      - name: Deploy updated playlist to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --dir=deploy --prod --site="$NETLIFY_SITE_ID"
